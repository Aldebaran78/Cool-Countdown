// --- Validazione e normalizzazione: nessun campo viene applicato senza controllo ---
const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function normLogo(l) {
  if (!l || typeof l !== "object" || typeof l.value !== "string") return null;
  if (l.type === "image" && (/^data:image\//i.test(l.value) || /^https?:\/\//i.test(l.value))) return { type: "image", value: l.value };
  if (l.type === "text" && l.value.length > 0) return { type: "text", value: Array.from(l.value).slice(0, 8).join("") };
  return null;
}
function normTime(t) {
  if (!t || !Number.isInteger(t.h) || !Number.isInteger(t.m) || !Number.isInteger(t.s)) return null;
  if (t.h < 0 || t.h > 99 || t.m < 0 || t.m > 59 || t.s < 0 || t.s > 59) return null;
  return { h: t.h, m: t.m, s: t.s };
}
// undefined = campo assente o non valido (si lascia com'è); null = valore "vuoto" esplicito
function normConfig(d) {
  if (!d || typeof d !== "object" || d.app !== "countdown" || d.version !== 1) throw new Error("formato non riconosciuto");
  const clampNum = (v, lo, hi) => (typeof v === "number" && Number.isFinite(v)) ? Math.min(hi, Math.max(lo, Math.round(v))) : undefined;
  const validTheme = (t) => typeof t === "string" && hasOwn(THEMES, t); // hasOwn: "constructor" & co. non sono temi
  const c = {};
  if (d.mode === "queue" || d.mode === "single") c.mode = d.mode;
  if (typeof d.title === "string") c.title = d.title.slice(0, 40);
  if (typeof d.font === "string" && Array.from(fontSel.options).some((o) => o.value === d.font)) c.font = d.font;
  if (typeof d.color === "string" && TITLE_COLORS.includes(d.color)) c.color = d.color;
  const ts = clampNum(d.titleSize, 100, 300);
  if (ts !== undefined) c.titleSize = Math.round(ts / 5) * 5;
  const t = normTime(d.time);
  if (t && t.h + t.m + t.s > 0) c.time = t;
  if (d.activePreset && typeof d.activePreset === "object") {
    if (d.activePreset.kind === "builtin" && Number.isInteger(d.activePreset.min)) c.activePreset = { kind: "builtin", min: d.activePreset.min };
    else if (d.activePreset.kind === "custom" && Number.isInteger(d.activePreset.index) && d.activePreset.index >= 0 && d.activePreset.index < 4) c.activePreset = { kind: "custom", index: d.activePreset.index };
  }
  if (Array.isArray(d.presets)) {
    c.presets = [0, 1, 2, 3].map((i) => {
      const p = normTime(d.presets[i]);
      return p && p.h + p.m + p.s > 0 ? p : null;
    });
  }
  if (typeof d.sound === "string" && Array.from(soundSel.options).some((o) => o.value === d.sound)) c.sound = d.sound;
  if (typeof d.soundOn === "boolean") c.soundOn = d.soundOn;
  const vol = clampNum(d.volume, 0, 100);
  if (vol !== undefined) c.volume = vol;
  if (hasOwn(d, "customSound")) c.customSound = typeof d.customSound === "string" && /^data:[^,]{0,100},/.test(d.customSound) ? d.customSound : null;
  if (c.sound === "custom" && !c.customSound && !(c.customSound === undefined && customSoundUrl)) c.sound = "bip"; // "custom" senza file non ha senso
  if (typeof d.tickBeep === "boolean") c.tickBeep = d.tickBeep;
  if ([5, 10, 15, 30].includes(d.tickSec)) c.tickSec = d.tickSec;
  if (hasOwn(d, "logo")) c.logo = normLogo(d.logo);
  const ls = clampNum(d.logoSize, 56, 450);
  if (ls !== undefined) c.logoSize = ls;
  if (validTheme(d.theme)) c.theme = d.theme;
  if (Array.isArray(d.queue)) {
    c.queue = d.queue.slice(0, 500).map((it) => {
      const tm = normTime(it);
      if (!tm) return null;
      return {
        ...tm,
        title: typeof it.title === "string" ? it.title.slice(0, 60) : "",
        logo: normLogo(it.logo),
        theme: validTheme(it.theme) ? it.theme : null
      };
    }).filter(Boolean);
  }
  return c;
}

function applyConfig(c) {
  // Si parte sempre dalla modalità Singolo: chiude anche una coda in pausa e
  // ripristina titolo/durata del Singolo prima di sovrascriverli
  if (queueMode) setMode(false);

  // Coda
  if (c.queue) {
    if (queueSel) deselectRow(true);
    queueListEl.textContent = "";
    for (const it of c.queue) queueListEl.appendChild(buildQueueRow(it));
    writeMask({ title: "", ...DEFAULT_DUR, logo: null, theme: null });
    maskDirty = false;
    syncQueueUI();
  }

  // Titolo: testo, font, colore, dimensione
  if (c.title !== undefined) { titleInput.value = c.title; titleDisplay.textContent = c.title; }
  if (c.font) { fontSel.value = c.font; applyTitleFont(); savePref("cd_font", c.font); }
  if (c.color) setColor(c.color); // salva da solo
  if (c.titleSize !== undefined) { titleSizeIn.value = String(c.titleSize); applyTitleScale(); }

  // Preset personalizzati (prima del tempo, così si può riattivare lo slot giusto)
  if (c.presets) {
    for (let i = 0; i < 4; i++) customPresets[i] = c.presets[i];
    activeCustom = -1;
    saveCustomPresets();
    renderCustomPresets();
    updateSaveBtn();
  }

  // Tempo del Singolo + preset attivo
  if (c.time) {
    clearActivePreset();
    clearActiveCustomPreset();
    hIn.value = String(c.time.h); mIn.value = String(c.time.m); sIn.value = String(c.time.s);
    state.total = (c.time.h * 3600 + c.time.m * 60 + c.time.s) * 1000;
    reset();
    const ap = c.activePreset;
    if (ap && ap.kind === "builtin" && c.time.h === 0 && c.time.s === 0 && c.time.m === ap.min) {
      const b = presetsWrap.querySelector('.preset[data-min="' + ap.min + '"]');
      if (b) b.classList.add("active");
    } else if (ap && ap.kind === "custom") {
      const p = customPresets[ap.index];
      if (p && p.h === c.time.h && p.m === c.time.m && p.s === c.time.s) {
        activeCustom = ap.index;
        renderCustomPresets();
      }
    }
  }

  // Suoni (si salvano le stesse chiavi usate dai controlli: l'import sopravvive al ricaricamento)
  if (c.customSound !== undefined) customSoundUrl = c.customSound;
  if (c.sound) { soundSel.value = c.sound; savePref("cd_sound", c.sound); }
  if (c.soundOn !== undefined) { soundOnChk.checked = c.soundOn; savePref("cd_sound_on", c.soundOn ? "1" : "0"); }
  if (c.volume !== undefined) { volIn.value = String(c.volume); volVal.textContent = c.volume + "%"; savePref("cd_vol", String(c.volume)); }
  if (c.tickBeep !== undefined) { tickBeepChk.checked = c.tickBeep; savePref("cd_tick_beep", c.tickBeep ? "1" : "0"); }
  if (c.tickSec !== undefined) {
    const r = document.querySelector('input[name="tickSec"][value="' + c.tickSec + '"]');
    if (r) { r.checked = true; tickSecVal = c.tickSec; savePref("cd_tick_sec", String(c.tickSec)); }
  }

  // Logo generale (e i campi della sezione Logo, sempre visibili)
  if (c.logoSize !== undefined) { logoSizeIn.value = String(c.logoSize); setLogoSize(c.logoSize); }
  if (c.logo !== undefined) {
    logo = c.logo;
    saveLogo();
    logoUrlIn.value = logo && logo.type === "image" ? logo.value : "";
    logoTxtIn.value = logo && logo.type === "text" ? logo.value : "";
    showLogoErr("");
  }
  applyLogo();

  // Colore dell'interfaccia
  if (c.theme !== undefined) setTheme(c.theme);

  // Modalità: per ultima, così Coda mostra subito anteprima e colori giusti
  if (c.mode === "queue") setMode(true);
  else syncQueueUI();
}

importBtn.addEventListener("click", () => {
  if (state.running) { alert(tr("alert_stop_first")); return; }
  importFileIn.click();
});
importFileIn.addEventListener("change", () => {
  const f = importFileIn.files[0];
  importFileIn.value = ""; // permette di reimportare lo stesso file
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    let cfg;
    try {
      cfg = normConfig(JSON.parse(reader.result)); // tutto validato prima di toccare l'app
    } catch (err) {
      console.warn("Import fallito:", err);
      showIoMsg(tr("io_invalid_file"), true);
      return;
    }
    try {
      applyConfig(cfg);
      showIoMsg(tr("io_imported", { q: timersInQueue(cfg.queue ? cfg.queue.length : 0) }), false);
    } catch (err) {
      console.warn("Import interrotto:", err);
      showIoMsg(tr("io_import_fail"), true);
    }
  };
  reader.onerror = () => {
    console.warn("Lettura del file fallita:", reader.error);
    showIoMsg(tr("io_read_fail"), true);
  };
  reader.readAsText(f, "utf-8");
});

// ---- Avvio a schermo intero automatico ----
// I browser permettono requestFullscreen() solo con un gesto utente (o se
// al sito è già stata concessa l'autorizzazione). Si prova subito all'avvio;
// se viene rifiutato, si entra in fullscreen al primo click o tasto premuto.
enterFullscreen();
if (!document.fullscreenElement) {
  const armAutoFs = () => {
    window.removeEventListener("pointerdown", armAutoFs);
    window.removeEventListener("keydown", armAutoFs);
    enterFullscreen(); // no-op se nel frattempo è già in fullscreen
  };
  window.addEventListener("pointerdown", armAutoFs);
  window.addEventListener("keydown", armAutoFs);
}

applyI18n();
render();
</script>
</body>
