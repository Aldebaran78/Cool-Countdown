<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f1a">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<script>
// PWA: applica il tema salvato PRIMA del primo paint, senza flash del default
try { const t = localStorage.getItem("cd_theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script>
// i18n: applica la lingua salvata PRIMA del primo paint (regole CSS [data-lang])
try { const l = localStorage.getItem("cd_lang"); if (l) document.documentElement.dataset.lang = l; } catch (e) {}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0b0f1a;
  --card: rgba(255, 255, 255, .06);
  --border: rgba(255, 255, 255, .12);
  --text: #e8ecf4;
  --muted: #8b93a7;
  --accent1: #6366f1;
  --accent2: #22d3ee;
  --glow: 99, 102, 241;
}
/* Temi di colore alternativi (suggerimento 16): il cambio è istantaneo
   perché l'intera interfaccia deriva da queste custom properties */
[data-theme="rosso"] { --accent1: #ef4444; --accent2: #f59e0b; --glow: 239, 68, 68; }
[data-theme="verde"] { --accent1: #10b981; --accent2: #a3e635; --glow: 16, 185, 129; }
[data-theme="rosa"]  { --accent1: #ec4899; --accent2: #8b5cf6; --glow: 236, 72, 153; }
[data-theme="blu"]   { --accent1: #3b82f6; --accent2: #0ea5e9; --glow: 59, 130, 246; }
[data-theme="ambra"] { --accent1: #f59e0b; --accent2: #fde047; --glow: 245, 158, 11; }
[data-theme="viola"]   { --accent1: #8b5cf6; --accent2: #c084fc; --glow: 139, 92, 246; }
[data-theme="arancio"] { --accent1: #f97316; --accent2: #fdba74; --glow: 249, 115, 22; }
[data-theme="turchese"]{ --accent1: #0d9488; --accent2: #2dd4bf; --glow: 13, 148, 136; }
[data-theme="corallo"] { --accent1: #f43f5e; --accent2: #fb7185; --glow: 244, 63, 94; }
[data-theme="magenta"] { --accent1: #c026d3; --accent2: #e879f9; --glow: 192, 38, 211; }
[data-theme="argento"] { --accent1: #94a3b8; --accent2: #e2e8f0; --glow: 148, 163, 184; }
html, body { height: 100%; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: grid;
  place-items: center;
  min-height: 100vh;
  overflow: auto;
  position: relative;
  /* Riserva in alto lo spazio per il titolo (fisso al viewport) dimensionato
     già per il massimo (300%): valore COSTANTE, così la card resta immobile
     a qualsiasi grandezza del font e il titolo non può mai sovrapporvisi.
     20px = top del .title-display; 1.6 = line-height(1.35)+padding(0.25em);
     12px = buffer. In play torna a 0 perché la card riempie tutto lo schermo. */
  padding-top: calc(20px + 2.3rem * 3 * 1.6 + 12px);
}
body.playing { padding-top: 0; }
body::before, body::after {
  content: "";
  position: fixed;
  width: 480px; height: 480px;
  border-radius: 50%;
  filter: blur(120px);
  opacity: .35;
  pointer-events: none;
}
body::before { background: var(--accent1); top: -120px; left: -120px; }
body::after { background: var(--accent2); bottom: -140px; right: -100px; }
.card {
  position: relative;
  z-index: 1;
  display: grid;
  /* Due colonne: timer (con modalità Singolo / Coda) | impostazioni */
  grid-template-columns: minmax(0, 1fr) minmax(260px, 320px);
  /* 940px: larghezza minima perché i 6 preset (fino a "15 min") stiano
     tutti su una riga nella colonna del timer senza andare a capo */
  width: min(940px, calc(100vw - 32px));
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 34px;
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow: 0 24px 64px rgba(0, 0, 0, .45);
}
/* Colonna sinistra: timer, identica all'impaginazione precedente */
.timer-col {
  text-align: center;
  min-width: 0;
  padding: 0 28px;
  /* Colonna flessibile: lo stage (Singolo/Coda) prende l'altezza che resta
     rispetto alla colonna delle impostazioni, quindi la card ha la STESSA
     altezza in entrambe le modalità */
  display: flex;
  flex-direction: column;
}
.timer-col > .mode-switch, .timer-col > .ring-wrap, .timer-col > .controls, .timer-col > .hints { flex: none; }
/* Campo titolo nella colonna sinistra */
#title {
  display: block;
  width: min(320px, 90%);
  margin: 0 auto 4px;
  background: rgba(255, 255, 255, .05);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 12px;
  font-size: .9rem;
  text-align: center;
  outline: none;
  transition: border-color .2s;
}
#title:focus { border-color: var(--accent2); }
#title::placeholder { color: var(--muted); }
/* Titolo sempre in alto al centro dello schermo, nella stessa posizione
   che ha durante il countdown: fisso rispetto al viewport, quindi resta
   identico a riposo e in play senza mai spostare il resto del layout */
.title-display {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  max-width: 90vw;
  font-family: var(--tfont, inherit);
  color: var(--tcolor, inherit);
  font-size: calc(2.3rem * var(--tscale, 1));
  font-weight: 600;
  /* line-height 1 con overflow:hidden tagliava le discendenti (g, p, y) e gli
     sbalzi dei font corsivi: più altezza di riga e un po' di respiro ai lati */
  line-height: 1.35;
  padding: .05em .25em .2em;
  box-sizing: border-box;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
/* Slider dimensione titolo (100-300%) */
.ts-size { display: flex; align-items: center; gap: 8px; font-size: .8rem; user-select: none; }
.ts-size input[type="range"] { flex: 1; accent-color: var(--accent2); cursor: pointer; }
/* Anello responsive: 260px di default, si rimpicciolisce se la colonna
   centrale è più stretta (SVG con viewBox e .time in inset:0 scalano da soli) */
.ring-wrap { position: relative; width: min(180px, 100%); aspect-ratio: 1; margin: 6px auto 12px; }
.ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
/* Colori del gradiente dell'anello: seguono il tema attivo senza JS */
#grad stop:first-child { stop-color: var(--accent1); }
#grad stop:last-child { stop-color: var(--accent2); }
/* In play l'anello è nascosto: la barra in fondo mostra i progressi */
body.playing .ring-svg { display: none; }
/* Formato con ore: font ridotto perché "H:MM:SS" resti dentro il cerchio */
.time.has-hours { font-size: calc(1.6rem + 14px); }
/* Barra di avanzamento orizzontale in fondo: piena all'avvio, si ritira da destra a sinistra */
.progress-bar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  height: 40px;
  z-index: 10;
  background: rgba(255, 255, 255, .06);
  display: none;
}
body.playing .progress-bar { display: block; }
.progress-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 100%;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));
}
.time {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-size: calc(2.7rem + 13px);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}
/* Ultimi 10 secondi: numeri gialli con alone, come il testo del logo */
.time.warn {
  color: #fde047;
  text-shadow: 0 0 28px rgba(253, 224, 71, .8),
               0 0 10px rgba(253, 224, 71, .5),
               0 3px 12px rgba(0, 0, 0, .7);
}
.presets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.preset {
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: .85rem;
  cursor: pointer;
  transition: color .15s, border-color .15s, transform .15s, background .15s;
}
.preset:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); transform: translateY(-1px); }
.preset.active {
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  color: #fff;
  border-color: transparent;
}
.custom { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 20px; }
.custom input {
  width: 64px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-size: 1.1rem;
  font-weight: 600;
  text-align: center;
  padding: 8px 0;
  outline: none;
  font-variant-numeric: tabular-nums;
  transition: border-color .15s;
}
.custom input:focus { border-color: var(--accent2); }
.custom-presets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
.cp-slot {
  position: relative; min-width: 70px;
  background: rgba(255, 255, 255, .04);
  border: 1px dashed var(--border); color: var(--muted);
  border-radius: 999px; padding: 6px 14px; font-size: .85rem;
  font-family: inherit; cursor: pointer;
  transition: color .15s, border-color .15s, transform .15s, background .15s;
  font-variant-numeric: tabular-nums;
}
.cp-slot.filled { border-style: solid; color: var(--text); }
.cp-slot:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); transform: translateY(-1px); }
.cp-slot.active { background: linear-gradient(135deg, var(--accent1), var(--accent2)); color: #fff; border-color: transparent; }
.cp-slot .cp-del {
  position: absolute; top: -7px; right: -7px;
  width: 18px; height: 18px; line-height: 16px; border-radius: 50%;
  background: #3a3a4a; color: #fff; border: 1px solid var(--border);
  font-size: .72rem; cursor: pointer;
  display: none; align-items: center; justify-content: center; padding: 0;
}
.cp-slot.filled .cp-del { display: flex; }
.cp-slot .cp-del:hover { background: #e05252; border-color: #e05252; }
.save-preset {
  margin-left: 8px; background: rgba(255, 255, 255, .04);
  border: 1px solid var(--border); color: var(--muted);
  border-radius: 999px; padding: 6px 14px; font-size: .85rem;
  font-family: inherit; cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.save-preset:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); }
.save-preset.full { border-color: #e05252; color: #ff9a9a; }
.custom input::-webkit-outer-spin-button,
.custom input::-webkit-inner-spin-button { -webkit-appearance: none; }
.custom input { -moz-appearance: textfield; appearance: textfield; }
.custom span { color: var(--muted); font-size: .8rem; }
.controls { display: flex; gap: 12px; justify-content: center; }
button.main {
  flex: 1;
  max-width: 200px;
  border: none;
  border-radius: 999px;
  padding: 14px 0;
  font-size: 1rem;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  box-shadow: 0 8px 24px rgba(var(--glow), .35);
}
button.main:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(var(--glow), .5); }
button.main:active { transform: translateY(0); }
button.ghost {
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 999px;
  padding: 14px 20px;
  font-size: 1.1rem;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
button.ghost:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); }
.hints {
  margin-top: 16px;
  font-size: .75rem;
  color: var(--muted);
}
/* Pulsatore in modalità coda: stesso gradiente, alone extra per segnalare lo stato */
button.main.queue-mode { box-shadow: 0 8px 24px rgba(var(--glow), .35), 0 0 0 2px rgba(var(--accent2), .45); }
/* ── Coda di countdown: colonna a sinistra del timer ────────────────────
   Ogni riga = un timer della coda con titolo proprio e durata h:m:s.
   Il JS popola #queueList, aggiorna #qCount e alterna il testo/la
   classe del pulsante Avvia ↔ Avvio Coda (sezione "Coda di countdown"). */
/* Selettore modalità sopra l'anello: Singolo | Coda */
.mode-switch {
  display: inline-flex;
  gap: 4px;
  padding: 4px;
  margin: 0 auto 6px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 999px;
}
.mode-btn {
  border: none;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: .85rem;
  font-weight: 600;
  padding: 7px 22px;
  border-radius: 999px;
  cursor: pointer;
  transition: color .15s, background .25s;
}
.mode-btn:hover { color: var(--text); }
.mode-btn.active {
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  color: #fff;
}
/* Stage: contiene i due pannelli (Singolo e Coda) sovrapposti. Il pannello
   Singolo scivola a sinistra e il pannello Coda entra da destra; l'altezza
   dello stage segue quella del pannello attivo (impostata da JS). */
.mode-stage {
  position: relative;
  overflow: hidden;
  margin: 0 -4px;
  /* flex-basis 0 + min-height: non spinge l'altezza della card, si adatta
     allo spazio disponibile (con un minimo per non schiacciarsi) */
  flex: 1 1 0;
  /* intestazione + 5 timer + maschera con riga logo aperta: la card si allunga
     solo se serve (e solo verso l'alto, vedi anchorCard) */
  min-height: 364px;
  transition: opacity .4s ease;
}
.pane {
  position: absolute;
  inset: 0;
  min-width: 0;
  padding: 4px 4px 0;
}
.pane-single {
  transform: none;
  opacity: 1;
  visibility: visible;
  transition: transform .45s cubic-bezier(.4, 0, .2, 1), opacity .45s ease, visibility 0s;
}
.pane-queue {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-bottom: 12px;
  transform: translateX(100%);
  opacity: 0;
  visibility: hidden; /* fuori dal tab order quando non attivo */
  transition: transform .45s cubic-bezier(.4, 0, .2, 1), opacity .45s ease, visibility 0s linear .45s;
}
.timer-col.is-queue .pane-single {
  transform: translateX(-100%);
  opacity: 0;
  visibility: hidden;
  transition: transform .45s cubic-bezier(.4, 0, .2, 1), opacity .45s ease, visibility 0s linear .45s;
}
.timer-col.is-queue .pane-queue {
  transform: none;
  opacity: 1;
  visibility: visible;
  transition: transform .45s cubic-bezier(.4, 0, .2, 1), opacity .45s ease, visibility 0s;
}
/* La lista ha altezza fissa e scorre internamente
   se i timer in coda sono più di quanti stiano visibili */
.queue-list {
  flex: 1 1 0;
  /* 5 righe da 34px + 4 spazi da 5px: sempre visibili senza scorrere, anche con
     la riga del logo aperta nella maschera */
  min-height: 192px;
  overflow-y: auto;
  scrollbar-gutter: stable;          /* niente scatti quando compare la scrollbar */
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding-right: 4px;
}
/* Scrollbar sottile nello stile della pagina: Firefox usa le proprietà standard,
   Chrome/Safari/Edge i pseudo-elementi (se ci sono le proprietà standard,
   Chrome ignorerebbe i pseudo-elementi, quindi solo dove non sono supportati) */
@supports not selector(::-webkit-scrollbar) {
  .queue-list { scrollbar-width: thin; scrollbar-color: rgba(var(--glow), .6) rgba(255, 255, 255, .04); }
}
.queue-list::-webkit-scrollbar { width: 8px; }
.queue-list::-webkit-scrollbar-track { background: rgba(255, 255, 255, .04); border-radius: 999px; }
.queue-list::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, var(--accent1), var(--accent2));
  border-radius: 999px;
}
.queue-list::-webkit-scrollbar-thumb:hover { filter: brightness(1.2); }
/* Coda vuota: segnaposto al centro dell'area fissa */
.queue-list:empty::before {
  content: "Nessun timer in coda";
  margin: auto;
  color: var(--muted);
  font-size: .8rem;
}
/* Testo della coda vuota nelle altre lingue (il default sopra è l'italiano) */
[data-lang="en"] .queue-list:empty::before { content: "No timers in the queue"; }
[data-lang="fr"] .queue-list:empty::before { content: "Aucun minuteur en file"; }
[data-lang="es"] .queue-list:empty::before { content: "No hay temporizadores en la cola"; }
[data-lang="de"] .queue-list:empty::before { content: "Keine Timer in der Warteschlange"; }
[data-lang="ru"] .queue-list:empty::before { content: "В очереди нет таймеров"; }
[data-lang="zh"] .queue-list:empty::before { content: "队列中没有计时器"; }
.queue-head { display: flex; align-items: baseline; justify-content: space-between; }
.q-count {
  font-size: .75rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.q-count[hidden] { display: none; }
/* Ogni timer della coda ha una sfumatura diversa e molto soft del tema scelto:
   --qa = quanta parte di accent1 (il resto è accent2), --qt = intensità della
   tinta. Due color-mix annidati (a 2 colori) funzionano in tutti i browser;
   il vecchio color-mix a 3 colori veniva scartato e lasciava il fondo scuro.
   Le tinte scorrono da accent1 ad accent2 e si ripetono ogni 6 elementi. */
.queue-item, .q-mask {
  --qa: 100%;
  --qt: 14%;
  --tint: color-mix(in srgb, color-mix(in srgb, var(--accent1) var(--qa), var(--accent2)) var(--qt), transparent);
  background-color: rgba(255, 255, 255, .03);
  background-image: linear-gradient(var(--tint), var(--tint));
  border: 1px solid var(--border);
}
/* Riga compatta dell'elenco: ① Titolo · durata · ✕ (una riga sola, ~34px) */
.queue-item {
  display: flex;
  align-items: center;
  gap: 8px;
  border-radius: 10px;
  padding: 4px 6px 4px 8px;
  transition: border-color .15s, box-shadow .15s;
}
.qr-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
  font-size: .85rem;
}
.qr-title.empty { color: var(--muted); font-style: italic; }
.qr-logo {
  flex: none;
  width: 20px; height: 20px;
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: 5px;
  font-size: .9rem;
  line-height: 1;
}
.qr-logo[hidden] { display: none; }
.qr-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.qr-time {
  flex: none;
  font-size: .8rem;
  font-weight: 600;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.queue-item .q-num { width: 20px; height: 20px; font-size: .68rem; }
.queue-item .q-del { width: 24px; height: 24px; }
/* Colore a contrasto: opposto sulla ruota dei colori (+180° di tonalità) rispetto
   al tema scelto. Dove il browser non supporta i colori relativi resta l'ambra. */
:root { --contrast: #f59e0b; }
@supports (color: oklch(from red l c h)) {
  :root { --contrast: oklch(from var(--accent1) 0.82 0.17 calc(h + 180)); }
}
/* Il timer che partirà alla prossima pressione di Spazio (o riprenderà dalla pausa) */
.queue-item.next {
  --tint: color-mix(in srgb, var(--contrast) 24%, transparent);
  border-color: var(--contrast);
  box-shadow: 0 0 0 1px var(--contrast), 0 0 16px color-mix(in srgb, var(--contrast) 45%, transparent);
}
.queue-item.next .q-num { background: var(--contrast); color: #111; }
.queue-item.next .qr-title { font-weight: 600; }
.queue-item.next .qr-time { color: var(--contrast); }
.queue-item.next .qr-time { display: inline-flex; align-items: center; gap: 5px; }
.queue-item.next .qr-time::before {
  content: "";
  width: 0; height: 0;
  border-left: 6px solid currentColor;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
}
/* Già eseguiti in questa sessione */
.queue-item.done-it { opacity: .45; }
.queue-item.selected { border-color: var(--accent2); box-shadow: 0 0 0 1px var(--accent2); }
/* Maschera unica sotto l'elenco (stessa grafica dell'elemento di coda) */
.q-mask {
  flex: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border-radius: 12px;
  padding: 8px 10px;
  transition: border-color .2s, box-shadow .2s;
}
.q-mask.editing { border-color: var(--accent2); box-shadow: 0 0 0 1px rgba(var(--glow), .45); }
.q-addbtn {
  flex: none;
  width: 28px; height: 28px;
  display: grid;
  place-items: center;
  padding: 0;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  color: #fff;
  font-size: 1.2rem;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
  transition: transform .1s, filter .15s;
}
.q-addbtn:hover { transform: scale(1.1); filter: brightness(1.12); }
.q-addbtn:active { transform: scale(.95); }
/* "Salta" per riga: cerchio come duplica/rimuovi con icona »| (doppia freccia
   + barra); visibile solo in una sessione di coda in pausa/attesa e mai sulla
   riga che partirà con la prossima pressione di Spazio */
.q-skip {
  flex: none;
  width: 24px; height: 24px;
  display: grid;
  place-items: center;
  padding: 0;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--muted);
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s, transform .1s;
}
.q-skip svg { display: block; }
.q-skip:hover { color: #fff; border-color: var(--accent2); background: rgba(var(--glow), .25); transform: scale(1.08); }
.q-skip[hidden] { display: none; }
.q-time input.bad { border-color: #e05252; }
.queue-item { cursor: grab; touch-action: pan-y; }
/* Logo proprio del timer: pulsante tondo come duplica/rimuovi + riga a scomparsa */
.q-logo {
  flex: none;
  width: 28px; height: 28px;
  display: grid;
  place-items: center;
  padding: 0;
  overflow: hidden;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--muted);
  font-size: .8rem;
  line-height: 1;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s, transform .1s;
}
.q-logo img { width: 100%; height: 100%; object-fit: contain; padding: 3px; display: block; }
.q-logo:hover { color: #fff; border-color: var(--accent2); background: rgba(var(--glow), .25); transform: scale(1.08); }
.q-logo.on, .q-logo[aria-expanded="true"] { border-color: var(--accent2); color: var(--text); }
.q-color-dot {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c1), var(--c2));
}
.q-color-row { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 9px; padding: 3px 0; }
.q-mask.color-open .q-color-row { display: flex; }
.q-theme-dot {
  width: 18px; height: 18px;
  padding: 0;
  border-radius: 50%;
  border: 2px solid transparent;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  cursor: pointer;
  transition: transform .15s ease, border-color .15s ease;
}
.q-theme-dot:hover { transform: scale(1.2); }
.q-theme-dot.on { border-color: #fff; }
/* Pallino nella riga dell'elenco: solo se il timer ha un colore proprio */
.qr-theme {
  flex: none;
  width: 9px; height: 9px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c1), var(--c2));
}
.qr-theme[hidden] { display: none; }
.q-logo-row { display: none; align-items: center; gap: 6px; }
.q-mask.logo-open .q-logo-row { display: flex; }
.q-logo-prev {
  flex: none;
  width: 30px; height: 30px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--muted);
  font-size: 1.05rem;
  line-height: 1;
}
.q-logo-prev img { width: 100%; height: 100%; object-fit: contain; padding: 2px; display: block; }
.q-logo-in {
  flex: 1;
  min-width: 0;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: .78rem;
  padding: 7px 9px;
  outline: none;
  transition: border-color .2s;
}
.q-logo-in:focus { border-color: var(--accent2); }
.q-logo-in.bad { border-color: #e05252; }
.q-logo-in::placeholder { color: var(--muted); }
.q-logo-file, .q-logo-clr {
  flex: none;
  background: rgba(255, 255, 255, .05);
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--text);
  font: inherit;
  font-size: .75rem;
  padding: 7px 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.q-logo-clr { border-style: solid; color: var(--muted); }
.q-logo-file:hover { border-color: var(--accent2); background: rgba(var(--glow), .15); }
.q-logo-clr:hover { color: #ff9a9a; border-color: #e05252; }
.queue-item input { cursor: text; }
.queue-item .q-num { touch-action: none; }
/* Riga trascinata: sollevata sopra le altre, con ombra e bordo del tema */
.queue-item.dragging {
  position: relative;
  z-index: 5;
  cursor: grabbing;
  border-color: var(--accent2);
  box-shadow: 0 14px 30px rgba(0, 0, 0, .5), 0 0 0 1px var(--accent2);
}
.queue-list.is-dragging, .queue-list.is-dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
.queue-item:nth-child(6n + 2) { --qa: 80%; }
.queue-item:nth-child(6n + 3) { --qa: 60%; }
.queue-item:nth-child(6n + 4) { --qa: 40%; }
.queue-item:nth-child(6n + 5) { --qa: 20%; }
.queue-item:nth-child(6n + 6) { --qa: 0%; }
/* Riga superiore: numero · titolo (flessibile) · duplica · rimuovi */
.q-top { display: flex; align-items: center; gap: 8px; }
.q-num {
  flex: none;
  width: 22px; height: 22px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  color: #fff;
  font-size: .72rem;
  font-weight: 700;
}
.q-title {
  flex: 1;
  min-width: 0;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: .85rem;
  padding: 7px 10px;
  outline: none;
  transition: border-color .2s;
}
.q-title:focus { border-color: var(--accent2); }
.q-title::placeholder { color: var(--muted); }
/* Riga inferiore: durata h:m:s distribuita su tutta la larghezza */
.q-time { display: flex; align-items: center; justify-content: center; gap: 5px; }
.q-time span + input { margin-left: 16px; } /* spazio tra un gruppo (valore + etichetta) e il successivo */
.q-time input {
  width: 40px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: .8rem;
  font-weight: 600;
  text-align: center;
  padding: 6px 0;
  outline: none;
  font-variant-numeric: tabular-nums;
  transition: border-color .15s;
}
.q-time input:focus { border-color: var(--accent2); }
.q-time span { color: var(--muted); font-size: .75rem; }
.q-time input::-webkit-outer-spin-button,
.q-time input::-webkit-inner-spin-button { -webkit-appearance: none; }
.q-time input { -moz-appearance: textfield; appearance: textfield; }
/* Duplica / rimuovi: cerchi con icona SVG centrata al pixel (display:grid +
   place-items:center), fondo appena visibile e hover colorato per ruolo */
.q-dup, .q-del {
  flex: none;
  width: 28px; height: 28px;
  display: grid;
  place-items: center;
  padding: 0;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 50%;
  color: var(--muted);
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s, transform .1s;
}
.q-dup svg, .q-del svg { display: block; }
.q-dup:hover { color: #fff; border-color: var(--accent2); background: rgba(var(--glow), .25); transform: scale(1.08); }
.q-del:hover { color: #fff; border-color: #e05252; background: rgba(224, 82, 82, .25); transform: scale(1.08); }
/* Colonna destra: tutte le impostazioni */
.settings {
  position: relative;
  padding-left: 24px;
  display: flex;
  flex-direction: column;
  gap: 30px;
  font-size: .85rem;
}
/* Separatore verticale tra timer e impostazioni: stessa hairline sfumata
   con glow del tema dei separatori orizzontali tra le sezioni */
.settings::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -12px; /* metà del padding-left di 24px */
  width: 1px;
  background: linear-gradient(180deg, transparent, var(--border) 15%, rgba(var(--glow), .55) 50%, var(--border) 85%, transparent);
  box-shadow: 0 0 8px rgba(var(--glow), .25);
}
.set-group { display: flex; flex-direction: column; gap: 10px; }
/* Separatore tra sezioni: hairline sfumata con glow nel colore del tema */
.set-group + .set-group { position: relative; }
.set-group + .set-group::before {
  content: "";
  position: absolute;
  top: -15px; /* metà del gap di 30px tra le sezioni */
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--border) 15%, rgba(var(--glow), .55) 50%, var(--border) 85%, transparent);
  box-shadow: 0 0 8px rgba(var(--glow), .25);
}
.set-title {
  font-size: .72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--muted);
}
.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.switch input { accent-color: var(--accent2); cursor: pointer; }
.tick-sec { display: flex; flex-direction: row; gap: 14px; }
.tick-sec label { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; font-size: .8rem; }
.tick-sec input { accent-color: var(--accent2); cursor: pointer; }
.tick-hint { font-size: .75rem; color: var(--muted); }
/* Controlli suono: select + slider volume */
.sound-ctl { display: flex; align-items: center; gap: 8px; }
.sound-ctl label { user-select: none; }
/* Tendina colore titolo: bottone con campionario + popup di riquadri colorati */
.color-pick { position: relative; display: inline-flex; }
#colorBtn {
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 7px;
  cursor: pointer;
  display: flex;
  align-items: center;
}
.color-chip { width: 20px; height: 13px; border-radius: 3px; background: #fff; display: block; }
.color-pop {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  z-index: 60;
  background: rgba(15, 18, 28, .97);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(3, 26px);
  gap: 6px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
}
.color-pop[hidden] { display: none; }
.color-swatch { width: 26px; height: 26px; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; }
.color-swatch:hover { transform: scale(1.12); }
.color-swatch.sel { border-color: var(--accent2); }
#soundSel, #fontSel {
  background: rgba(255, 255, 255, .05);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 8px;
  font-size: .8rem;
  cursor: pointer;
}
/* Opzioni del dropdown: testo nero su bianco, leggibili in ogni tema/browser */
#soundSel option, #fontSel option { background: #fff; color: #000; }
#volIn {
  width: 90px;
  accent-color: var(--accent2);
  cursor: pointer;
}
/* Logo in alto a sinistra */
.logo {
  position: fixed;
  top: 16px; left: 16px;
  z-index: 0; /* sotto la card (z-index 1): l'anteprima non copre mai il menu */
  width: var(--logo-size, 168px);
  height: var(--logo-size, 168px);
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  overflow: hidden;
}
.logo img { width: 100%; height: 100%; object-fit: contain; object-position: center top; padding: 0 4%; }
.logo-text { font-size: calc(var(--logo-size, 168px) * .42); font-weight: 700; line-height: 1; }
#logoPh { width: calc(var(--logo-size, 168px) * .32); height: calc(var(--logo-size, 168px) * .32); }
.logo [hidden] { display: none !important; }
/* In play il menu è nascosto: il logo torna sopra i numeri */
body.playing .logo { z-index: 10; }
/* A schermo intero, se non c'è un logo reale (solo placeholder),
   nascondi l'intero riquadro per non mostrare il quadrato vuoto */
body.playing .logo:not(.has-logo) { display: none; }
/* Logo a schermo intero: rimuovi il quadrato (sfondo, bordo, blur)
   e aggiungi un'ombra per far risaltare l'immagine sullo sfondo scuro */
body.playing .logo.has-logo {
  background: transparent;
  border: none;
  border-radius: 0;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  overflow: visible;
}
body.playing .logo img {
  filter: drop-shadow(0 8px 28px rgba(var(--glow), .75))
          drop-shadow(0 0 14px rgba(var(--glow), .55))
          drop-shadow(0 3px 10px rgba(0, 0, 0, .6));
}
body.playing .logo .logo-text {
  text-shadow: 0 0 28px rgba(var(--glow), .9), 0 0 10px rgba(var(--glow), .6), 0 3px 12px rgba(0, 0, 0, .7);
}
/* Logo: sezione fissa nella colonna delle impostazioni */
/* Logo del timer (singolo): le tre caselle + Applica/Rimuovi vivono nel pannello
   Singolo, tra i campi del tempo e il pulsante Avvia. In coda ogni timer ha il
   proprio logo, quindi qui si imposta quello globale del countdown singolo. */
/* Separatore e titolo "Logo" nel pannello Singolo: stesso stile delle
   sezioni del menu (hairline sfumata con glow, titolo .set-title). */
.single-logo-sep {
  max-width: 540px;
  height: 1px;
  margin: 20px auto 12px;
  background: linear-gradient(90deg, transparent, var(--border) 15%, rgba(var(--glow), .55) 50%, var(--border) 85%, transparent);
  box-shadow: 0 0 8px rgba(var(--glow), .25);
}
.single-logo-title { text-align: center; margin: 0 auto 10px; }
.single-logo {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  align-items: stretch;
  max-width: 540px;
  margin: 0 auto 18px;
}
.single-logo .lp-btn,
.single-logo input[type="text"] {
  flex: 1 1 140px;
  min-width: 0;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: .85rem;
  padding: 9px 10px;
  outline: none;
  transition: border-color .15s, background .15s;
}
.single-logo .lp-btn { border-style: dashed; cursor: pointer; }
.single-logo .lp-btn:hover { border-color: var(--accent2); background: rgba(34, 211, 238, .08); }
.single-logo input[type="text"]:focus { border-color: var(--accent2); }
.single-logo .lp-clear {
  flex: 0 0 auto;
  width: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, .05);
  color: var(--muted);
  border-radius: 10px;
  font-size: 1rem;
  line-height: 1;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.single-logo .lp-clear:hover { color: var(--text); border-color: rgba(255, 255, 255, .3); }
.single-logo .lp-err { flex-basis: 100%; text-align: center; }
.lp-btn {
  display: block;
  background: rgba(255, 255, 255, .05);
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: .9rem;
  text-align: center;
  padding: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.lp-btn:hover { border-color: var(--accent2); background: rgba(34, 211, 238, .08); }
.lp-size { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); }
.lp-size input[type="range"] { flex: 1; accent-color: var(--accent2); cursor: pointer; }
.lp-err { font-size: .8rem; color: #f87171; }
/* Ora di fine prevista: in basso a destra, solo durante il countdown */
.end-time {
  position: fixed;
  right: 20px; bottom: 52px;
  z-index: 10;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  /* Stessa ombra del logo a schermo intero (3 livelli: glow + alone + nero) */
  box-shadow: 0 8px 28px rgba(var(--glow), .75),
              0 0 14px rgba(var(--glow), .55),
              0 3px 10px rgba(0, 0, 0, .6);
}
.end-time[hidden] { display: none; }
/* Modalità play: countdown a tutto schermo, ottimizzato per 16:9 */
body.playing { overflow: hidden; cursor: none; }
/* Crossfade all'avvio: il menu sfuma via (opacity) uscendo dal flusso
   (position:absolute), così l'anello si centra a tutto schermo mentre
   il timer emerge con un fadein. Al reset/pausa il menu torna in 400 ms. */
.presets, .custom, .custom-presets, .controls, .hints, .settings, .mode-switch { transition: opacity .4s ease; }
body.playing .presets,
body.playing .custom,
body.playing .custom-presets,
body.playing .controls,
body.playing .mode-stage,
body.playing .mode-switch,
body.playing .hints,
body.playing .settings {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
body.playing .timer-col { padding: 0; }
/* Fadein del timer (titolo + anello) sincronizzato col fadeout del menu */
body.playing .title-display,
body.playing .ring-wrap { animation: timerIn .45s ease both; }
@keyframes timerIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}
body.playing .card {
  top: 0 !important; /* a schermo intero niente scostamento */
  width: 100%;
  height: 100vh;
  padding: 0;
  background: transparent;
  border: none;
  border-radius: 0;
  box-shadow: none;
  display: grid;
  grid-template-columns: 1fr; /* colonna unica a tutta larghezza: il timer non resta nella colonna sinistra stretta */
  grid-template-rows: 1fr;    /* riga unica che riempie l'altezza → anello centrato (il titolo è fisso in alto) */
  place-items: center;
}
body.playing .ring-wrap {
  width: min(96vw, 160vh);
  height: auto;
  aspect-ratio: 16 / 9;
  margin: 0;
}
/* Play: i numeri riempiono lo schermo. fitTime() misura il font reale
   e imposta la dimensione esatta (~90% della larghezza); questi valori
   sono solo il fallback del primo frame, prima che JS intervenga */
body.playing .time {
  position: fixed;
  inset: 0;
  font-size: 24vw;
}
body.playing .time.has-hours { font-size: 17vw; }
/* A tempo scaduto i numeri 00:00 diventano rossi con alone e pulsano col messaggio */
body.done .time {
  color: #ef4444;
  text-shadow: 0 0 28px rgba(239, 68, 68, .8),
               0 0 10px rgba(239, 68, 68, .5),
               0 3px 12px rgba(0, 0, 0, .7);
  animation: pulse 1s ease-in-out infinite;
}
/* "Tempo scaduto!": sotto il 00:00, rosso pulsante continuo (finché non si preme Spazio/R) */
.done-msg {
  margin-top: 2.5vmin;
  font-size: 6vmin;
  font-weight: 800;
  letter-spacing: .04em;
  color: #ef4444;
  animation: pulse 1s ease-in-out infinite;
}
/* A schermo intero il messaggio è ancorato in basso, centrato */
body.playing .done-msg {
  position: fixed;
  left: 0; right: 0;
  top: 84%;
  margin-top: 0;
  text-align: center;
  font-size: 9vmin;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); opacity: .7; }
}
/* Temi di colore: pallini nel pannello impostazioni */
.themes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.theme-dot {
  width: 18px; height: 18px; border-radius: 50%; padding: 0;
  border: 2px solid transparent; cursor: pointer;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  transition: transform .15s ease, border-color .15s ease;
}
.theme-dot:hover { transform: scale(1.2); }
.theme-dot.active { border-color: #fff; }
/* Importa / Esporta: due pulsanti affiancati, stile ghost compatto del pannello */
.io-btns { display: flex; gap: 8px; }
.io-btn {
  flex: 1;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 999px;
  padding: 8px 12px;
  font: inherit;
  font-size: .85rem;
  cursor: pointer;
  transition: color .15s, border-color .15s, background .15s;
}
.io-btn:hover { color: var(--text); border-color: var(--accent2); background: rgba(var(--glow), .15); }
/* Bandierine lingue */
.lang-flags { display: flex; gap: 4px; }
.lang-flag {
  /* flex:1 + min-width:0 → le 7 bandierine dividono la larghezza disponibile
     e restano SEMPRE su una sola riga, a qualsiasi dimensione del pannello */
  flex: 1 1 0;
  min-width: 0;
  white-space: nowrap;
  line-height: 1;
  background: rgba(255, 255, 255, .05);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 0;
  cursor: pointer;
  transition: transform .15s, border-color .15s, background .15s;
}
.lang-flag svg { display: block; margin: 0 auto; width: min(28px, 100%); height: auto; border-radius: 3px; }
.lang-flag:hover { transform: translateY(-2px); border-color: rgba(255, 255, 255, .3); }
.lang-flag.active {
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  border-color: transparent;
}
.io-msg { margin: 0; font-size: .75rem; color: var(--muted); }
.io-msg.err { color: #ff9a9a; }
.io-msg[hidden] { display: none; }
/* Animazione di ingresso (suggerimento 17): fade + scale in 300 ms,
   l'anello arriva con 100 ms di ritardo per un effetto a cascata */
@keyframes enter {
  from { opacity: 0; transform: scale(.94); }
  to   { opacity: 1; transform: scale(1); }
}
.card      { animation: enter .3s ease-out both; }
.ring-wrap { animation: enter .3s ease-out .1s both; }
@media (prefers-reduced-motion: reduce) {
  .card, .ring-wrap { animation: none; }
}
/* Finestre strette: le due colonne si impilano (timer → impostazioni) */
@media (max-width: 920px) {
  .card { grid-template-columns: 1fr; }
  .timer-col { order: 1; padding: 0; }
  .settings {
    order: 3;
    padding-left: 0;
    padding-top: 20px;
    margin-top: 4px;

    height: 1px;

  }
}

#clearQueueBtn:not([hidden]) { display: grid; place-items: center; padding: 0 16px; }
#clearQueueBtn svg { display: block; }
#clearQueueBtn:hover { color: #ff9a9a; border-color: #e05252; background: rgba(224, 82, 82, .12); }

function fmt(ms) {
  const t = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = (n) => String(n).padStart(2, "0");
  return h > 0 ? p(h) + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s);
}

// Barra di avanzamento che cambia colore in base al tempo residuo:
// gradiente normale → giallo sotto il 25% → rosso sotto il 10%
// Temi di colore (suggerimento 16): [accento primario, accento secondario] per tema.
// Il tema attivo è già applicato su <html data-theme> dallo script inline in <head>,
// prima del primo paint: qui lo leggiamo solo per i colori dell'anello SVG.
const THEMES = {
  "": ["#6366f1", "#22d3ee"],    // indaco / ciano (default)
  rosso: ["#ef4444", "#f59e0b"], // rosso / oro
  verde: ["#10b981", "#a3e635"], // verde / menta
  rosa: ["#ec4899", "#8b5cf6"],  // rosa / viola
  blu: ["#3b82f6", "#0ea5e9"],   // blu / azzurro
  ambra: ["#f59e0b", "#fde047"], // ambra / giallo
  viola: ["#8b5cf6", "#c084fc"], // viola / lilla
  arancio: ["#f97316", "#fdba74"], // arancio / pesca
  turchese: ["#0d9488", "#2dd4bf"], // turchese / menta
  corallo: ["#f43f5e", "#fb7185"], // corallo / rosa acceso
  magenta: ["#c026d3", "#e879f9"], // magenta / fucsia
  argento: ["#94a3b8", "#e2e8f0"] // argento / bianco
};
let currentTheme = "";
try {
  const t = localStorage.getItem("cd_theme");
  if (t && THEMES[t]) currentTheme = t;
} catch (err) { /* localStorage non disponibile: resta il tema default */ }
let [ACCENT1, ACCENT2] = THEMES[currentTheme];
let ringColorState = -1; // 0 normale, 1 giallo, 2 rosso: evita scritture DOM inutili
let warnState = false;   // numeri gialli negli ultimi 10 s: evita toggle DOM a ogni frame
function applyBarColor(frac) {
  const tier = frac <= 0.10 ? 2 : frac <= 0.25 ? 1 : 0;
  if (tier === ringColorState) return;
  ringColorState = tier;
  let bg;
  if (tier === 2)      bg = "linear-gradient(90deg, #ef4444, #f87171)";
  else if (tier === 1) bg = "linear-gradient(90deg, #f59e0b, #fbbf24)";
  else                 bg = "linear-gradient(90deg, " + ACCENT1 + ", " + ACCENT2 + ")";
  progressFill.style.background = bg;
}

function updateEndTime() {
  if (state.running) {
    const d = new Date(Date.now() + state.remaining);
    endTimeEl.textContent = tr("ends_at") +
      String(d.getHours()).padStart(2, "0") + ":" +
      String(d.getMinutes()).padStart(2, "0");
    endTimeEl.hidden = false;
  } else {
    endTimeEl.hidden = true;
  }
}

// Play: numeri dimensionati per occupare ~90% della larghezza schermo.
// Il canvas usa lo stesso motore font del layout: una sola misura è
// esatta perché la larghezza del testo scala linearmente col font-size.
// Si ricalcola solo se cambiano lunghezza del testo o larghezza finestra
// (il check per frame è O(1)); in menu rimuove la dimensione inline così
// i numeri del pannello restano invariati.
const fitCtx = document.createElement("canvas").getContext("2d");
let fitKey = "";
function fitTime() {
  if (!document.body.classList.contains("playing")) {
    if (timeEl.style.fontSize !== "") timeEl.style.fontSize = "";
    fitKey = "";
    return;
  }
  const key = timeEl.textContent.length + ":" + window.innerWidth;
  if (key === fitKey) return;
  fitKey = key;
  const cs = getComputedStyle(timeEl);
  const n = timeEl.textContent.length;
  fitCtx.font = "700 100px " + cs.fontFamily;
  const emW = fitCtx.measureText(timeEl.textContent).width / 100;
  const lsEm = (parseFloat(cs.letterSpacing) || 0) / parseFloat(cs.fontSize) * n;
  const target = window.innerWidth * 0.90;
  const size = Math.min(target / (emW + lsEm),
                        window.innerHeight * 0.85);
  timeEl.style.fontSize = size.toFixed(1) + "px";
}

function render() {
  const txt = fmt(state.remaining);
  timeEl.textContent = txt;
  timeEl.classList.toggle("has-hours", txt.length > 5);
  fitTime();
  // Giallo a 10 secondi dalla fine (solo durante la corsa)
  const warn = state.running && state.remaining <= 10000;
  if (warn !== warnState) {
    warnState = warn;
    timeEl.classList.toggle("warn", warn);
  }
  const frac = state.total > 0 ? state.remaining / state.total : 0;
  progressFill.style.width = (frac * 100) + "%";
  ringFg.style.strokeDashoffset = String(100 - frac * 100);
  applyBarColor(frac);
  document.title = state.running
    ? fmt(state.remaining) + " — " + (titleInput.value || tr("app_title"))
    : tr("app_title");
}

let prevWholeSec = -1;
function tick() {
  if (!state.running) return;
  state.remaining = state.endTime - performance.now();
  if (state.remaining <= 0) {
    state.remaining = 0;
    prevWholeSec = -1;
    render();
    finish();
    return;
  }
  // Bip al secondo negli ultimi N secondi (configurabile)
  const wholeSec = Math.ceil(state.remaining / 1000);
  if (tickBeepChk.checked && wholeSec <= tickSecVal && wholeSec !== prevWholeSec) {
    playTickBeep();
  }
  prevWholeSec = wholeSec;
  render();
}

function playTickBeep() {
  const vol = (parseInt(volIn.value, 10) || 0) / 100;
  if (vol <= 0) return;
  ensureAudio();
  if (!audioCtx) return;
  try { strike("bip", audioCtx.currentTime, vol); } catch (err) { console.warn("Bip tick fallito:", err); }
}

function loop() {
  if (!state.running) return;
  tick();
  if (state.running) rafId = requestAnimationFrame(loop);
}

function setRunningUI(running) {
  updateStartLabel();
  updateSkipBtns(); // in pausa/attesa si può saltare a un altro timer
}

// Fullscreen reale via Web Fullscreen API: se il browser rifiuta
// (es. file:// senza gesture), il countdown parte comunque.
function enterFullscreen() {
  if (document.fullscreenElement) return;
  const p = document.documentElement.requestFullscreen();
  if (p && p.catch) p.catch((err) => console.warn("Fullscreen non disponibile:", err));
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    enterFullscreen();
  } else {
    const p = document.exitFullscreen();
    if (p && p.catch) p.catch((err) => console.warn("Uscita fullscreen fallita:", err));
  }
}

function toggle() {
  if (state.running) {
    state.running = false;
    cancelAnimationFrame(rafId);
    clearInterval(intervalId);
    state.remaining = Math.max(0, state.endTime - performance.now());
    setRunningUI(false);
    document.body.classList.remove("playing");
    updateEndTime();
    render();
    return;
  }
  // Coda: timer scaduto con altri in coda → Spazio mostra il prossimo (non lo avvia)
  if (queueAwaitNext) { showNextQueueItem(); return; }
  // A tempo scaduto (00:00 rosso pulsante) lo Spazio non riavvia: torna al menu
  if (state.remaining <= 0) { reset(); return; }
  // Modalità Coda, sessione non ancora avviata → parte il primo timer della coda
  if (queueMode && !queueRun) { startQueue(); return; }
  // Prossimo timer già mostrato nel menu: parte quello che è dopo l'ultimo finito
  // nell'ordine ATTUALE dell'elenco (può essere cambiato nel frattempo)
  if (queuePending && !commitPending()) { reset(); return; }
  beginRun();
}

function beginRun() {
  state.endTime = performance.now() + state.remaining;
  state.running = true;
  setRunningUI(true);
  document.body.classList.remove("done");
  doneMsgEl.hidden = true;
  document.body.classList.add("playing");
  ensureAudio(); // sblocca l'AudioContext dentro un user gesture
  updateEndTime();
  loop();
  // Safety net: rAF is paused in background tabs, the interval keeps
  // the countdown accurate and fires the completion on time.
  intervalId = setInterval(tick, 1000);
}

function reset() {
  state.running = false;
  cancelAnimationFrame(rafId);
  clearInterval(intervalId);
  prevWholeSec = -1;
  state.remaining = state.total;
  setRunningUI(false);
  document.body.classList.remove("playing");
  document.body.classList.remove("done");
  doneMsgEl.hidden = true;
  // Coda: l'azzeramento interrompe la sessione (la lista resta intatta)
  queueRun = null;
  queueAwaitNext = false;
  queueCurRow = null;
  queueDoneSet = new Set();
  queueDoneRow = null;
  queuePending = false;
  markQueueProgress(false); // sessione finita: via le evidenziazioni
  previewQueue(); // in modalità Coda torna a mostrare il primo timer
  updateEndTime();
  render();
}

function finish() {
  state.running = false;
  cancelAnimationFrame(rafId);
  clearInterval(intervalId);
  setRunningUI(false);
  // Togli il giallo "ultimi 10 secondi": a tempo scaduto conta solo il rosso
  timeEl.classList.remove("warn");
  warnState = false;
  // Rosso pulsante continuo: resta finché non si preme Spazio (riavvio) o R (reset)
  document.body.classList.add("done");
  doneMsgEl.hidden = false;
  updateEndTime();
  beep();
  // Coda: se c'è un timer successivo, lo Spazio mostrerà il prossimo
  if (queueRun && queueCurRow) {
    queueDoneSet.add(queueCurRow);
    queueDoneRow = queueCurRow;
    queueDoneIdx = Array.prototype.indexOf.call(queueListEl.children, queueCurRow);
    queueCurRow = null;
    if (nextQueueRow()) queueAwaitNext = true;
    markQueueProgress(false);
  }
}

function ensureAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (err) {
    console.warn("Audio non disponibile:", err);
  }
}

// Suono finale selezionabile (sintetizzato via Web Audio, zero asset esterni)
// oppure file audio caricato dall'utente. Volume 0-100.
// endFreq opzionale: se presente la frequenza fa un ramp esponenziale da freq a
// endFreq durante dur (usato per la sirena).
function tone(freq, start, dur, vol, type = "sine", endFreq = null) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  if (endFreq != null) {
    osc.frequency.setValueAtTime(freq, start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), start + dur);
  } else {
    osc.frequency.value = freq;
  }
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(Math.max(0.001, vol), start + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.05);
}

// Un singolo "squillo" del suono scelto, a partire da t0.
function strike(choice, t0, vol) {
  switch (choice) {
    case "campanella":
      // Due parziali (fondamentale + armonico) con decadimento: suono da campana
      tone(1318.5, t0, 1.4, vol);
      tone(2637, t0, 0.9, vol * 0.4);
      break;
    case "ding":
      // Acuto pulito
      tone(1568, t0, 0.6, vol);
      break;
    case "sirena":
      // Salita + discesa di frequenza (andata e ritorno)
      tone(600, t0, 0.25, vol, "sawtooth", 1200);
      tone(1200, t0 + 0.25, 0.25, vol, "sawtooth", 600);
      break;
    case "arpeggio": {
      // Salita Do-Mi-Sol-Do (onda a triangolo, morbida)
      const notes = [523.25, 659.25, 783.99, 1046.5];
      for (let i = 0; i < notes.length; i++) tone(notes[i], t0 + i * 0.08, 0.18, vol, "triangle");
      break;
    }
    default: // bip
      tone(880, t0, 0.25, vol);
  }
}

// Distanza tra l'inizio di uno squillo e il successivo, per tipo di suono.
const STRIKE_GAP = { bip: 0.35, ding: 0.7, campanella: 1.0, sirena: 0.6, arpeggio: 0.5 };

// Ripete 3 squilli del suono scelto (usato sia in anteprima sia a fine countdown).
function playSound3(choice, vol) {
  const t0 = audioCtx.currentTime;
  const gap = STRIKE_GAP[choice] || 0.4;
  for (let i = 0; i < 3; i++) strike(choice, t0 + i * gap, vol);
}

// Anteprima del suono scelto al momento della selezione dal menu:
// suoni sintetizzati → 3 squilli (come a fine countdown); file audio → estratto
// di 1 secondo.
function previewSound() {
  const vol = (parseInt(volIn.value, 10) || 0) / 100;
  if (vol <= 0) return;
  const choice = soundSel.value;
  if (choice === "custom") {
    if (!customSoundUrl) return;
    try {
      const a = new Audio(customSoundUrl);
      a.volume = vol;
      const stop = () => { a.pause(); a.removeEventListener("timeupdate", stop); };
      a.addEventListener("timeupdate", () => { if (a.currentTime >= 1) stop(); });
      a.play().catch((err) => console.warn("Anteprima audio fallita:", err));
    } catch (err) {
      console.warn("Audio non disponibile:", err);
    }
    return;
  }
  ensureAudio();
  if (!audioCtx) return;
  try {
    playSound3(choice, vol);
  } catch (err) {
    console.warn("Anteprima audio fallita:", err);
  }
}

function beep() {
  if (!soundOnChk.checked) return;
  const vol = (parseInt(volIn.value, 10) || 0) / 100;
  if (vol <= 0) return;
  const choice = soundSel.value;
  if (choice === "custom") {
    if (!customSoundUrl) { soundSel.value = "bip"; return; }
    try {
      const a = new Audio(customSoundUrl);
      a.volume = vol;
      a.play().catch((err) => console.warn("Riproduzione file audio fallita:", err));
    } catch (err) {
      console.warn("Audio non disponibile:", err);
    }
    return;
  }
  ensureAudio();
  if (!audioCtx) return;
  try {
    playSound3(choice, vol);
  } catch (err) {
    console.warn("Audio non disponibile:", err);
  }
}

function clampInt(v, min, max) {
  const n = parseInt(v, 10);
  if (Number.isNaN(n)) return min;
  return Math.min(max, Math.max(min, n));
}

function clearActivePreset() {
  const active = presetsWrap.querySelector(".preset.active");
  if (active) active.classList.remove("active");
}

presetsWrap.addEventListener("click", (e) => {

  hIn.value = "0";

});

function readCustom() {
  const h = clampInt(hIn.value, 0, 99);
  const m = clampInt(mIn.value, 0, 59);
  const s = clampInt(sIn.value, 0, 59);
  const total = (h * 3600 + m * 60 + s) * 1000;
  if (total > 0) {
    clearActivePreset();
    clearActiveCustomPreset();
    state.total = total;
    reset();
  }
}

/* ===== Preset personalizzati: 4 slot salvabili in localStorage ===== */
const customPresetsEl = document.getElementById("customPresets");
const savePresetBtn = document.getElementById("savePresetBtn");
const CUSTOM_KEY = "cd_custom_presets";
let customPresets = [null, null, null, null]; // slot: null oppure {h, m, s}
let activeCustom = -1;                        // slot attivo (-1 = nessuno)

function loadCustomPresets() {
  try {
    const raw = localStorage.getItem(CUSTOM_KEY);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (Array.isArray(arr)) {
      for (let i = 0; i < 4; i++) {
        const p = arr[i];
        if (p && Number.isInteger(p.h) && Number.isInteger(p.m) && Number.isInteger(p.s)
            && p.h >= 0 && p.h <= 99 && p.m >= 0 && p.m <= 59 && p.s >= 0 && p.s <= 59) {
          customPresets[i] = { h: p.h, m: p.m, s: p.s };
        }
      }
    }
  } catch (err) {
    console.warn("Preset personalizzati non caricati:", err);
  }
}

function saveCustomPresets() {
  try {
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(customPresets));
  } catch (err) {
    console.warn("Preset personalizzati non salvati:", err);
  }
}

function renderCustomPresets() {
  customPresetsEl.textContent = "";
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 4; i++) {
    const p = customPresets[i];
    const slot = document.createElement("div");
    slot.className = "cp-slot" + (p ? " filled" : "") + (i === activeCustom ? " active" : "");
    if (p) {
      slot.textContent = fmt((p.h * 3600 + p.m * 60 + p.s) * 1000);
      slot.title = tr("cp_apply");
      slot.tabIndex = 0;
      slot.addEventListener("click", () => applyCustomPreset(i));
      slot.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); applyCustomPreset(i); }
      });
      const del = document.createElement("button");
      del.type = "button";
      del.className = "cp-del";
      del.textContent = "\u00d7";
      del.title = tr("cp_delete");
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        customPresets[i] = null;
        if (activeCustom === i) activeCustom = -1;
        saveCustomPresets();
        renderCustomPresets();
        updateSaveBtn();
      });
      slot.appendChild(del);
    } else {
      slot.textContent = "+";
      slot.title = tr("cp_empty_slot");
    }
    frag.appendChild(slot);
  }
  customPresetsEl.appendChild(frag);
}

function applyCustomPreset(i) {
  const p = customPresets[i];
  if (!p) return;
  clearActivePreset();
  hIn.value = String(p.h);
  mIn.value = String(p.m);
  sIn.value = String(p.s);
  state.total = (p.h * 3600 + p.m * 60 + p.s) * 1000;
  reset();
  activeCustom = i;
  const el = customPresetsEl.children[i];
  if (el) el.classList.add("active");
}

function clearActiveCustomPreset() {
  if (activeCustom === -1) return;
  const el = customPresetsEl.children[activeCustom];
  if (el) el.classList.remove("active");
  activeCustom = -1;
}

function updateSaveBtn() {
  const full = customPresets.every((p) => p !== null);
  savePresetBtn.classList.toggle("full", full);
  savePresetBtn.title = full ? tr("cp_full") : tr("cp_save");
}

savePresetBtn.addEventListener("click", () => {

});

// ---- Riordino per trascinamento (mouse e touch) ----
// Si trascina la riga da qualsiasi punto che non sia un campo o un pulsante
// (con il touch solo dal numero). Mentre si trascina le altre righe si
// spostano con una breve animazione; vicino ai bordi la lista scorre da sola.
function startQueueDrag(e, row) {
  if (e.button !== undefined && e.button !== 0) return;
  if (e.target.closest("input, button, select, textarea, label")) return;
  if (e.pointerType !== "mouse" && !e.target.closest(".q-num")) return;
  e.preventDefault();
  const list = queueListEl, pid = e.pointerId, GAP = parseFloat(getComputedStyle(queueListEl).rowGap) || 0;
  let startY = e.clientY, lastY = e.clientY;
  const startScroll = list.scrollTop;
  let dragging = false, raf = 0;
  try { row.setPointerCapture(pid); } catch (err) { /* capture non disponibile */ }

  function apply() {
    row.style.transform = "translateY(" + (lastY - startY + (list.scrollTop - startScroll)) + "px)";
  }
  // Sposta nel DOM la riga vicina (mai quella trascinata, per non perdere il
  // pointer capture) e compensa il salto di layout della riga trascinata.
  function shift(other, dir) {
    const before = other.getBoundingClientRect().top;
    if (dir > 0) list.insertBefore(other, row);
    else list.insertBefore(other, row.nextSibling);
    startY += dir * (other.offsetHeight + GAP);
    const d = before - other.getBoundingClientRect().top;
    other.style.transition = "none";
    other.style.transform = "translateY(" + d + "px)";
    other.getBoundingClientRect(); // forza il reflow prima della transizione
    other.style.transition = "transform .18s ease";
    other.style.transform = "";
    setTimeout(() => { other.style.transition = ""; }, 220);
    apply();
    syncQueueUI(); // rinumera e aggiorna l'anteprima del primo timer
  }
  function swapIfNeeded() {
    for (let guard = 0; guard < 50; guard++) {
      const r = row.getBoundingClientRect(), mid = r.top + r.height / 2;
      const next = row.nextElementSibling, prev = row.previousElementSibling;
      if (next) {
        const nr = next.getBoundingClientRect();
        if (mid > nr.top + nr.height / 2) { shift(next, 1); continue; }
      }
      if (prev) {
        const pr = prev.getBoundingClientRect();
        if (mid < pr.top + pr.height / 2) { shift(prev, -1); continue; }
      }
      break;
    }
  }
  function autoScroll() {
    if (!dragging) return;
    const lr = list.getBoundingClientRect(), EDGE = 36;
    let v = 0;
    if (lastY < lr.top + EDGE) v = -Math.min(14, Math.ceil((lr.top + EDGE - lastY) / 5));
    else if (lastY > lr.bottom - EDGE) v = Math.min(14, Math.ceil((lastY - (lr.bottom - EDGE)) / 5));
    if (v) { list.scrollTop += v; apply(); swapIfNeeded(); }
    raf = requestAnimationFrame(autoScroll);
  }
  function onMove(ev) {
    if (ev.pointerId !== pid) return;
    lastY = ev.clientY;
    if (!dragging) {
      if (Math.abs(lastY - startY) < 4) return; // soglia: un semplice click non sposta nulla
      dragging = true;
      row.classList.add("dragging");
      list.classList.add("is-dragging");
      raf = requestAnimationFrame(autoScroll);
    }
    apply();
    swapIfNeeded();
  }
  function onEnd(ev) {
    if (ev.pointerId !== pid) return;
    row.removeEventListener("pointermove", onMove);
    row.removeEventListener("pointerup", onEnd);
    row.removeEventListener("pointercancel", onEnd);
    try { row.releasePointerCapture(pid); } catch (err) { /* già rilasciato */ }
    cancelAnimationFrame(raf);
    if (dragging) {
      // la riga "atterra" con una breve animazione nella sua posizione finale
      row.style.transition = "transform .18s ease";
      row.style.transform = "";
      list.classList.remove("is-dragging");
      setTimeout(() => { row.classList.remove("dragging"); row.style.transition = ""; }, 200);
      suppressRowClick = Date.now() + 300; // il rilascio non deve selezionare la riga
      syncQueueUI();
    }
  }
  row.addEventListener("pointermove", onMove);
  row.addEventListener("pointerup", onEnd);
  row.addEventListener("pointercancel", onEnd);
}

// Legge le righe visibili e restituisce gli item validi (durata > 0).
// Legge una riga della coda: titolo, durata (ms) e logo proprio (o null)
function readRow(row) {
  const d = row._d;
  return { title: d.title, ms: durMs(d), logo: d.logo || null, theme: d.theme == null ? null : d.theme };
}
function readQueue() {
  const items = [];
  for (const row of queueListEl.children) {
    const it = readRow(row);
    if (it.ms > 0) items.push(it);
  }
  return items;
}

// La lista riserva spazio a destra (scrollbar + margine): la maschera ne tiene
// conto, così ha la stessa larghezza delle righe dei timer.
function alignMask() {
  const l = queueListEl, cs = getComputedStyle(l);
  const rowW = l.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  qMask.style.marginRight = Math.max(0, l.offsetWidth - rowW) + "px";
}
function syncQueueUI() {
  const rows = queueListEl.children, n = rows.length;
  for (let i = 0; i < n; i++) rows[i].querySelector(".q-num").textContent = String(i + 1);
  qCountEl.hidden = n === 0;
  if (n > 0) qCountEl.textContent = timerNoun(n);
  clearQueueBtn.hidden = n === 0 || !queueMode;
  const idx = queueSel && queueSel.isConnected ? Array.prototype.indexOf.call(rows, queueSel) : -1;
  mTitle.placeholder = idx >= 0 ? tr("ph_timer_n", { n: idx + 1 }) : tr("ph_new_timer");
  updateStartLabel();
  updateSkipBtns();
  alignMask();
  previewQueue();
}
function updateStartLabel() {
  startBtn.textContent = state.running ? tr("pause") : (queueMode ? tr("start_queue") : tr("start"));
  startBtn.classList.toggle("queue-mode", queueMode);
}

// In modalità Coda, a riposo, anello, titolo e logo mostrano il timer in modifica
// (durata, titolo e logo si aggiornano mentre si scrive, come il campo Titolo a destra).
// Non interviene durante una sessione di coda già avviata.
function previewQueue() {
  // Sessione in corso col prossimo timer nel menu: l'anteprima segue l'ordine attuale
  if (queueRun && queuePending && !state.running) { refreshPending(false); return; }
  if (!queueMode || queueRun || state.running) return;
  // Si mostra: la riga selezionata, altrimenti la maschera se la stai compilando,
  // altrimenti il primo timer della coda (o, se è vuota, i valori della maschera)
  let d;
  if (queueSel && queueSel.isConnected) d = queueSel._d;
  else if (maskDirty || !queueListEl.firstElementChild) d = readMask();
  else d = queueListEl.firstElementChild._d;
  titleDisplay.textContent = d.title;
  setLogoOverride(d.logo);
  // Il colore del timer si vede in anteprima solo mentre lo si modifica; a riposo
  // (o a sessione finita) l'interfaccia ha il colore scelto a destra
  const editing = (queueSel && queueSel.isConnected) || maskDirty;
  showTheme(editing ? d.theme : null);
  const ms = durMs(d);
  if (ms > 0) {
    state.total = ms;
    state.remaining = ms;
    render();
  }
}

// Prossimo timer da eseguire: tra le righe non ancora eseguite (e con durata),
// la prima che segue nell'elenco l'ultima terminata; se dopo non ce ne sono,
// si riparte dalla prima rimasta. Così riordinare le righe a sessione avviata
// cambia davvero cosa parte.
function nextQueueRow() {
  const rows = Array.from(queueListEl.children);
  const di = queueDoneRow ? (queueDoneRow.isConnected ? rows.indexOf(queueDoneRow) : queueDoneIdx - 0.5) : -1;
  const cand = rows.filter((r) => !queueDoneSet.has(r) && durMs(r._d) > 0);
  return cand.find((r) => rows.indexOf(r) > di) || cand[0] || null;
}

// Evidenzia nell'elenco il timer che partirà (o riprenderà) con Spazio e
// attenua quelli già eseguiti; con scroll lo porta in vista nella lista.
function markQueueProgress(scroll) {
  updateSkipBtns(); // la riga "in play" cambia: aggiorna i bottoni Salta
  for (const r of queueListEl.children) {
    r.classList.remove("next");
    r.classList.toggle("done-it", !!queueRun && queueDoneSet.has(r));
  }
  if (!queueRun) return;
  const target = queueCurRow || (queuePending ? nextQueueRow() : null);
  if (!target || !target.isConnected) return;
  target.classList.add("next");
  if (scroll) {
    const lr = queueListEl.getBoundingClientRect(), rr = target.getBoundingClientRect();
    if (rr.top < lr.top) queueListEl.scrollTop -= lr.top - rr.top + 4;
    else if (rr.bottom > lr.bottom) queueListEl.scrollTop += rr.bottom - lr.bottom + 4;
  }
}

// Carica nei display (titolo, logo, anello) i dati attuali di una riga
function loadQueueRow(row) {
  const it = readRow(row);
  titleInput.value = it.title;
  titleDisplay.textContent = it.title;
  setLogoOverride(it.logo);
  showTheme(it.theme); // colore proprio del timer (o quello dell'interfaccia)
  state.total = it.ms;
  state.remaining = it.ms;
}
// Aggiorna ciò che è mostrato nel menu per il prossimo timer (ordine/modifiche cambiati)
function refreshPending(scroll) {
  const r = nextQueueRow();
  if (r) loadQueueRow(r);
  markQueueProgress(scroll);
  render();
}
// Spazio sul prossimo timer mostrato: lo si ricalcola e si avvia
function commitPending() {
  const r = nextQueueRow();
  if (!r) return false;
  loadQueueRow(r);
  queueCurRow = r;
  queuePending = false;
  queueDoneRow = null;
  markQueueProgress(true);
  return true;
}

function startQueue() {
  const rows = Array.from(queueListEl.children).filter((r) => durMs(r._d) > 0);
  if (rows.length === 0) { alert(tr("alert_min_one")); return; }
  queueRun = true;
  queueAwaitNext = false;
  queuePending = false;
  queueDoneSet = new Set();
  queueDoneRow = null;
  queueDoneIdx = -1;
  queueCurRow = rows[0];
  loadQueueRow(queueCurRow);
  markQueueProgress(true);
  beginRun();
}

// "Salta" per riga: in una sessione di coda in pausa (o in attesa del prossimo)
// il bottone è visibile su ogni timer tranne quello che partirà con Spazio;
// premuto, tutto ciò che precede la riga nell'ordine attuale viene considerato
// eseguito e quel timer diventa quello che partirà con la prossima pressione.
function updateSkipBtns() {
  const show = !!(queueRun && !state.running);
  const target = show ? (queueCurRow || nextQueueRow()) : null;
  for (const r of queueListEl.children) {
    const b = r.querySelector(".q-skip");
    if (b) b.hidden = !show || r === target;
  }
}
function skipToRow(row) {
  if (!queueRun || state.running) return;
  if (!row || !row.isConnected || row === queueCurRow) return;
  if (durMs(row._d) <= 0) return;
  const rows = Array.from(queueListEl.children);
  const idx = rows.indexOf(row);
  if (idx < 0) return;
  for (let i = 0; i < idx; i++) queueDoneSet.add(rows[i]);
  queueDoneSet.delete(row); // anche se era già finito in questa sessione, si riparte da qui
  queueDoneRow = idx > 0 ? rows[idx - 1] : null;
  queueDoneIdx = idx > 0 ? idx - 1 : -1;
  queueCurRow = null;
  queueAwaitNext = false;
  queuePending = true; // il timer scelto è nel menu e parte con la prossima Spazio
  refreshPending(true);
  document.body.classList.remove("playing");
  document.body.classList.remove("done");
  doneMsgEl.hidden = true;
  timeEl.classList.remove("warn");
  warnState = false;
  prevWholeSec = -1;
  updateEndTime();
  render();
}

// Timer scaduto con altri in coda: carica il successivo nel menu (non lo avvia).
function showNextQueueItem() {
  queueAwaitNext = false;
  queuePending = true;
  refreshPending(true);
  document.body.classList.remove("playing");
  document.body.classList.remove("done");
  doneMsgEl.hidden = true;
  timeEl.classList.remove("warn");
  warnState = false;
  prevWholeSec = -1;
  updateEndTime();
  render();
}

// La card può diventare più alta delle impostazioni per far stare 5 timer in

// ---- Logo personalizzabile (alto a sinistra) ----
const logoEl = $("logo"), logoImg = $("logoImg"), logoTxt = $("logoTxt"),
      logoPh = $("logoPh"),
      logoFile = $("logoFile"), logoUrlIn = $("logoUrlIn"),
      logoTxtIn = $("logoTxtIn"), logoSizeIn = $("logoSizeIn"),
      logoErr = $("logoErr"),
      logoClear = $("logoClear");

const LOGO_KEY = "countdown-logo";
const SIZE_KEY = "countdown-logo-size";
let logo = null; // { type: "image", value } | { type: "text", value }
let logoSize = 168;

function setLogoSize(px) {
  logoSize = Math.min(450, Math.max(56, px));
  document.documentElement.style.setProperty("--logo-size", logoSize + "px");
  try { localStorage.setItem(SIZE_KEY, String(logoSize)); }
  catch (err) { console.warn("Impossibile salvare la dimensione:", err); }
}

function showLogoErr(msg) {
  if (msg) { logoErr.textContent = msg; logoErr.hidden = false; }
  else logoErr.hidden = true;
}

function setLogoOverride(l) {
  logoOverride = l || null;
  applyLogo();
}

function applyLogo() {
  // Nascondi TUTTI gli elementi con doppio meccanismo (attributo hidden +
  // display inline), poi mostra solo quello corretto: è impossibile che
  // immagine, testo e placeholder coesistano sullo schermo.
  for (const el of [logoImg, logoTxt, logoPh]) {
    el.hidden = true;
    el.style.display = "none";
  }
  const shown = logoOverride || logo; // logo del timer di coda, altrimenti quello generale
  if (shown && shown.type === "image") {
    logoImg.src = shown.value;
    logoImg.hidden = false;
    logoImg.style.display = "";
  } else if (shown && shown.type === "text") {
    logoTxt.textContent = shown.value;
    logoTxt.hidden = false;
    logoTxt.style.display = "";
  } else {
    logoPh.hidden = false;
    logoPh.style.display = "";
  }
  // Segna se c'è un logo reale: a schermo intero il placeholder resta nascosto
  logoEl.classList.toggle("has-logo", !!shown);
}

function saveLogo() {
  try {
    if (logo) localStorage.setItem(LOGO_KEY, JSON.stringify(logo));
    else localStorage.removeItem(LOGO_KEY);
  } catch (err) {
    console.warn("Impossibile salvare il logo:", err);
  }
}

function loadLogo() {
  try {
    const raw = localStorage.getItem(LOGO_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed && (parsed.type === "image" || parsed.type === "text") && typeof parsed.value === "string") {
      logo = parsed;
    }
  } catch (err) {
    console.warn("Logo salvato non valido:", err);
  }
}

logoImg.addEventListener("error", () => {
  // Logo di un timer di coda non caricabile: si torna al logo generale
  if (logoOverride && logoOverride.type === "image") {
    logoOverride = null;
    applyLogo();
    return;
  }
  // URL o immagine non raggiungibile: avvisa e torna al placeholder
  if (logo && logo.type === "image") {
    logo = null;
    saveLogo();
    applyLogo();
    alert(tr("alert_img_removed"));
  }
});

logoFile.addEventListener("change", () => {
  const file = logoFile.files[0];
  logoFile.value = "";
  if (!file) return;
  if (!file.type.startsWith("image/")) { alert(tr("alert_select_image")); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Ridimensiona a max 450 px: mantiene il localStorage leggero
      const scale = Math.min(1, 450 / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * scale));
      const h = Math.max(1, Math.round(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      logo = { type: "image", value: canvas.toDataURL("image/png") };
      logoUrlIn.value = "";
      logoTxtIn.value = "";
      showLogoErr("");
      saveLogo();
      applyLogo();
    };
    img.onerror = () => alert(tr("alert_read_img"));
    img.src = reader.result;
  };
  reader.onerror = () => alert(tr("alert_read_file"));
  reader.readAsDataURL(file);
});

// Auto-applica il logo mentre si scrive o si incolla (debounce di 350 ms per
// non sondare URL parziali): URL → verifica immagine, testo → immediato,
// entrambi vuoti → rimuove il logo.
function applyLogoFromInputs() {
  const url = logoUrlIn.value.trim();
  const txt = logoTxtIn.value.trim();
  if (url) {
    // Verifica che l'URL sia raggiungibile PRIMA di applicarlo
    const probe = new Image();
    probe.onload = () => {
      showLogoErr("");
      logo = { type: "image", value: url };
      saveLogo();
      applyLogo();
    };
    probe.onerror = () => showLogoErr(tr("url_unreachable_check"));
    probe.src = url;
  } else if (txt) {
    showLogoErr("");
    logo = { type: "text", value: txt };
    saveLogo();
    applyLogo();
  } else {
    showLogoErr("");
    logo = null;
    saveLogo();
    applyLogo();
  }
}
let logoApplyTimer = 0;
for (const el of [logoUrlIn, logoTxtIn]) {
  el.addEventListener("input", () => {
    clearTimeout(logoApplyTimer);
    logoApplyTimer = setTimeout(applyLogoFromInputs, 350);
  });
}

loadLogo();

logoUrlIn.value = logo && logo.type === "image" ? logo.value : "";
logoTxtIn.value = logo && logo.type === "text" ? logo.value : "";
